[project]
name = "quantlab"
version = "0.2.0"
description = "A leakage-audited walk-forward backtesting framework for systematic strategies, with a methodology-ablation study quantifying how much common backtest mistakes inflate (or distort) reported performance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaza" }]
keywords = ["backtesting", "quant", "finance", "walk-forward", "look-ahead-bias"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
data = ["yfinance>=0.2", "pandas-datareader>=0.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]